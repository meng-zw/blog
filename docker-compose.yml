name: xiaom-blog
services:
  db:
    image: mysql:8.4
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-blog}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-blog_app}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-local_only_change_me}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-local_root_change_me}
      TZ: Asia/Shanghai
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
  api:
    build: { context: ./blog-backend }
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?set SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?set SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD}
      BLOG_ADMIN_USERNAME: ${BLOG_ADMIN_USERNAME:?set BLOG_ADMIN_USERNAME}
      BLOG_ADMIN_PASSWORD: ${BLOG_ADMIN_PASSWORD:?set BLOG_ADMIN_PASSWORD}
      BLOG_ADMIN_DISPLAY_NAME: ${BLOG_ADMIN_DISPLAY_NAME:?set BLOG_ADMIN_DISPLAY_NAME}
      BLOG_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      BLOG_SESSION_COOKIE_SECURE: ${BLOG_SESSION_COOKIE_SECURE:-true}
      # Local remains the default. R2 is validated by the API only when it is
      # explicitly selected, so local deployments never need R2 credentials.
      BLOG_MEDIA_PROVIDER: ${BLOG_MEDIA_PROVIDER:-local}
      BLOG_MEDIA_LOCAL_DIRECTORY: /app/data/media
      BLOG_MEDIA_R2_ACCOUNT_ID: ${BLOG_MEDIA_R2_ACCOUNT_ID:-}
      BLOG_MEDIA_R2_ACCESS_KEY_ID: ${BLOG_MEDIA_R2_ACCESS_KEY_ID:-}
      BLOG_MEDIA_R2_SECRET_ACCESS_KEY: ${BLOG_MEDIA_R2_SECRET_ACCESS_KEY:-}
      BLOG_MEDIA_R2_BUCKET: ${BLOG_MEDIA_R2_BUCKET:-}
      BLOG_MEDIA_R2_ENDPOINT: ${BLOG_MEDIA_R2_ENDPOINT:-}
      BLOG_MEDIA_R2_PUBLIC_BASE_URL: ${BLOG_MEDIA_R2_PUBLIC_BASE_URL:-}
      BLOG_MEDIA_R2_UPLOAD_URL_TTL: ${BLOG_MEDIA_R2_UPLOAD_URL_TTL:-}
    volumes: ["media-data:/app/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/api/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    networks: [internal]
  web:
    build: { context: ./blog-frontend }
    restart: unless-stopped
    environment: { BACKEND_HOST: api, BACKEND_PORT: 8081 }
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]
volumes:
  mysql-data:
  media-data:
networks:
  internal: { driver: bridge }
