name: xiaom-blog
services:
  db:
    image: mysql:8.4
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-blog}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-blog_app}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-local_only_change_me}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-local_root_change_me}
      TZ: Asia/Shanghai
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
  api:
    build: { context: ./blog-backend }
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?set SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?set SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD}
      BLOG_ADMIN_USERNAME: ${BLOG_ADMIN_USERNAME:?set BLOG_ADMIN_USERNAME}
      BLOG_ADMIN_PASSWORD: ${BLOG_ADMIN_PASSWORD:?set BLOG_ADMIN_PASSWORD}
      BLOG_ADMIN_DISPLAY_NAME: ${BLOG_ADMIN_DISPLAY_NAME:?set BLOG_ADMIN_DISPLAY_NAME}
      BLOG_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      BLOG_SESSION_COOKIE_SECURE: ${BLOG_SESSION_COOKIE_SECURE:-true}
      # Local remains the default. R2 is validated by the API only when it is
      # explicitly selected, so local deployments never need R2 credentials.
      BLOG_MEDIA_PROVIDER: ${BLOG_MEDIA_PROVIDER:-local}
      BLOG_MEDIA_LOCAL_DIRECTORY: /app/data/media
      BLOG_MEDIA_R2_ACCOUNT_ID: ${BLOG_MEDIA_R2_ACCOUNT_ID:-}
      BLOG_MEDIA_R2_ACCESS_KEY_ID: ${BLOG_MEDIA_R2_ACCESS_KEY_ID:-}
      BLOG_MEDIA_R2_SECRET_ACCESS_KEY: ${BLOG_MEDIA_R2_SECRET_ACCESS_KEY:-}
      BLOG_MEDIA_R2_BUCKET: ${BLOG_MEDIA_R2_BUCKET:-}
      BLOG_MEDIA_R2_ENDPOINT: ${BLOG_MEDIA_R2_ENDPOINT:-}
      BLOG_MEDIA_R2_PUBLIC_BASE_URL: ${BLOG_MEDIA_R2_PUBLIC_BASE_URL:-}
      BLOG_MEDIA_R2_LEGACY_BUCKETS: ${BLOG_MEDIA_R2_LEGACY_BUCKETS:-}
      BLOG_MEDIA_R2_UPLOAD_URL_TTL: ${BLOG_MEDIA_R2_UPLOAD_URL_TTL:-}
      # Cloudreve is an API-only OAuth integration. The public web image and
      # Nginx never receive its credentials, tokens, encryption key or URLs.
      BLOG_MEDIA_CLOUDREVE_ENABLED: ${BLOG_MEDIA_CLOUDREVE_ENABLED:-false}
      BLOG_MEDIA_CLOUDREVE_BASE_URL: ${BLOG_MEDIA_CLOUDREVE_BASE_URL:-}
      BLOG_MEDIA_CLOUDREVE_AUTHORIZATION_URI: ${BLOG_MEDIA_CLOUDREVE_AUTHORIZATION_URI:-}
      BLOG_MEDIA_CLOUDREVE_TOKEN_URI: ${BLOG_MEDIA_CLOUDREVE_TOKEN_URI:-}
      BLOG_MEDIA_CLOUDREVE_REFRESH_URI: ${BLOG_MEDIA_CLOUDREVE_REFRESH_URI:-}
      BLOG_MEDIA_CLOUDREVE_USERINFO_URI: ${BLOG_MEDIA_CLOUDREVE_USERINFO_URI:-}
      BLOG_MEDIA_CLOUDREVE_REDIRECT_URI: ${BLOG_MEDIA_CLOUDREVE_REDIRECT_URI:-}
      BLOG_MEDIA_CLOUDREVE_API_BASE_PATH: ${BLOG_MEDIA_CLOUDREVE_API_BASE_PATH:-/api/v4}
      BLOG_MEDIA_CLOUDREVE_UPLOAD_CALLBACK_BASE_PATH: ${BLOG_MEDIA_CLOUDREVE_UPLOAD_CALLBACK_BASE_PATH:-/api/v4/callback}
      BLOG_MEDIA_CLOUDREVE_CLIENT_ID: ${BLOG_MEDIA_CLOUDREVE_CLIENT_ID}
      BLOG_MEDIA_CLOUDREVE_CLIENT_SECRET: ${BLOG_MEDIA_CLOUDREVE_CLIENT_SECRET}
      BLOG_MEDIA_CLOUDREVE_POLICY_ID: ${BLOG_MEDIA_CLOUDREVE_POLICY_ID}
      BLOG_MEDIA_CLOUDREVE_ROOT_PATH: ${BLOG_MEDIA_CLOUDREVE_ROOT_PATH:-/blog}
      BLOG_MEDIA_TOKEN_ENCRYPTION_KEY: ${BLOG_MEDIA_TOKEN_ENCRYPTION_KEY}
      # Development-only: permits HTTP only for a trusted private test network.
      BLOG_MEDIA_CLOUDREVE_ALLOW_TRUSTED_INTERNAL_HTTP: ${BLOG_MEDIA_CLOUDREVE_ALLOW_TRUSTED_INTERNAL_HTTP:-false}
      BLOG_MEDIA_CLOUDREVE_CONNECT_TIMEOUT: ${BLOG_MEDIA_CLOUDREVE_CONNECT_TIMEOUT:-5s}
      BLOG_MEDIA_CLOUDREVE_REQUEST_TIMEOUT: ${BLOG_MEDIA_CLOUDREVE_REQUEST_TIMEOUT:-30s}
      BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_MAX_REQUESTS: ${BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_MAX_REQUESTS:-30}
      BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_WINDOW: ${BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_WINDOW:-1m}
      BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_MAX_ENTRIES: ${BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_MAX_ENTRIES:-10000}
    volumes: ["media-data:/app/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/api/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    networks: [internal]
  web:
    build: { context: ./blog-frontend }
    restart: unless-stopped
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: 8081
      MEDIA_UPLOAD_ORIGIN: ${MEDIA_UPLOAD_ORIGIN:-}
      MEDIA_PUBLIC_ORIGINS: ${MEDIA_PUBLIC_ORIGINS:-}
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]
volumes:
  mysql-data:
  media-data:
networks:
  internal: { driver: bridge }
