spring:
  application:
    name: blog-backend
  profiles:
    default: dev
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MiB
      max-request-size: 51MiB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081
  # Direct/default deployments never trust client-supplied forwarding headers.
  forward-headers-strategy: none
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax

blog:
  public-base-url: ${BLOG_PUBLIC_BASE_URL:https://localhost}
  media:
    provider: ${BLOG_MEDIA_PROVIDER:local}
    directory: ${BLOG_MEDIA_LOCAL_DIRECTORY:${BLOG_MEDIA_DIR:./media}}
    upload-plan-rate-limit:
      maximum-requests: ${BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_MAX_REQUESTS:30}
      window: ${BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_WINDOW:1m}
      maximum-entries: ${BLOG_MEDIA_UPLOAD_PLAN_RATE_LIMIT_MAX_ENTRIES:10000}
    r2:
      account-id: ${BLOG_MEDIA_R2_ACCOUNT_ID:}
      access-key-id: ${BLOG_MEDIA_R2_ACCESS_KEY_ID:}
      secret-access-key: ${BLOG_MEDIA_R2_SECRET_ACCESS_KEY:}
      bucket: ${BLOG_MEDIA_R2_BUCKET:}
      endpoint: ${BLOG_MEDIA_R2_ENDPOINT:}
      public-base-url: ${BLOG_MEDIA_R2_PUBLIC_BASE_URL:}
      legacy-buckets: ${BLOG_MEDIA_R2_LEGACY_BUCKETS:}
      upload-url-ttl: ${BLOG_MEDIA_R2_UPLOAD_URL_TTL:10m}
    cloudreve:
      enabled: ${BLOG_MEDIA_CLOUDREVE_ENABLED:false}
      base-url: ${BLOG_MEDIA_CLOUDREVE_BASE_URL:}
      authorization-uri: ${BLOG_MEDIA_CLOUDREVE_AUTHORIZATION_URI:}
      token-uri: ${BLOG_MEDIA_CLOUDREVE_TOKEN_URI:}
      refresh-uri: ${BLOG_MEDIA_CLOUDREVE_REFRESH_URI:}
      userinfo-uri: ${BLOG_MEDIA_CLOUDREVE_USERINFO_URI:}
      redirect-uri: ${BLOG_MEDIA_CLOUDREVE_REDIRECT_URI:}
      client-id: ${BLOG_MEDIA_CLOUDREVE_CLIENT_ID:}
      client-secret: ${BLOG_MEDIA_CLOUDREVE_CLIENT_SECRET:}
      policy-id: ${BLOG_MEDIA_CLOUDREVE_POLICY_ID:}
      root-path: ${BLOG_MEDIA_CLOUDREVE_ROOT_PATH:/blog}
      token-encryption-key: ${BLOG_MEDIA_TOKEN_ENCRYPTION_KEY:}
      allow-trusted-internal-http: ${BLOG_MEDIA_CLOUDREVE_ALLOW_TRUSTED_INTERNAL_HTTP:false}
      connect-timeout: ${BLOG_MEDIA_CLOUDREVE_CONNECT_TIMEOUT:5s}
      request-timeout: ${BLOG_MEDIA_CLOUDREVE_REQUEST_TIMEOUT:30s}
  admin:
    bootstrap:
      username: ${BLOG_ADMIN_USERNAME:}
      password: ${BLOG_ADMIN_PASSWORD:}
      display-name: ${BLOG_ADMIN_DISPLAY_NAME:小M}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
