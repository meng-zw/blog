spring:
  application:
    name: blog-backend
  profiles:
    default: dev
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MiB
      max-request-size: 51MiB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081
  # Direct/default deployments never trust client-supplied forwarding headers.
  forward-headers-strategy: none
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax

blog:
  public-base-url: ${BLOG_PUBLIC_BASE_URL:https://localhost}
  media:
    directory: ${BLOG_MEDIA_DIR:./media}
  admin:
    bootstrap:
      username: ${BLOG_ADMIN_USERNAME:}
      password: ${BLOG_ADMIN_PASSWORD:}
      display-name: ${BLOG_ADMIN_DISPLAY_NAME:小M}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
