spring:
  application:
    name: blog-backend
  profiles:
    default: dev
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax

blog:
  admin:
    bootstrap:
      username: ${BLOG_ADMIN_USERNAME:}
      password: ${BLOG_ADMIN_PASSWORD:}
      display-name: ${BLOG_ADMIN_DISPLAY_NAME:小M}

upload:
  dir: ./uploads

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
