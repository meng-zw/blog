spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  # Production is valid only behind the private, same-origin Nginx proxy below.
  # Nginx overwrites forwarding headers and the backend port must not be public.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
blog:
  public-base-url: ${BLOG_PUBLIC_BASE_URL}
