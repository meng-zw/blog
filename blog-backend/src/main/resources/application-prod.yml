spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  # Production is valid only behind the private, same-origin Nginx proxy below.
  # Nginx overwrites forwarding headers and the backend port must not be public.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${BLOG_SESSION_COOKIE_SECURE:true}
blog:
  public-base-url: ${BLOG_PUBLIC_BASE_URL}
  media:
    provider: ${BLOG_MEDIA_PROVIDER:local}
    bucket: ${BLOG_MEDIA_R2_BUCKET:}
    r2:
      account-id: ${BLOG_MEDIA_R2_ACCOUNT_ID:}
      access-key-id: ${BLOG_MEDIA_R2_ACCESS_KEY_ID:}
      secret-access-key: ${BLOG_MEDIA_R2_SECRET_ACCESS_KEY:}
      bucket: ${BLOG_MEDIA_R2_BUCKET:}
      endpoint: ${BLOG_MEDIA_R2_ENDPOINT:}
      public-base-url: ${BLOG_MEDIA_R2_PUBLIC_BASE_URL:}
      region: ${BLOG_MEDIA_R2_REGION:auto}
      upload-url-ttl: ${BLOG_MEDIA_R2_UPLOAD_URL_TTL:10m}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
