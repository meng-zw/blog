name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json
      - name: Backend unit and Docker integration tests
        working-directory: blog-backend
        run: mvn -B -Dblog.requireDockerTests=true clean verify
      - name: Install frontend dependencies
        working-directory: blog-frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: blog-frontend
        run: npm run test:run
      - name: Frontend typecheck
        working-directory: blog-frontend
        run: npm run typecheck
      - name: Frontend production build
        working-directory: blog-frontend
        run: npm run build
      - name: Nginx template contract
        working-directory: blog-frontend
        run: npm run test:nginx-template
      - name: Backup and restore script contract
        run: |
          for test_file in scripts/tests/*_test.sh; do
            bash "$test_file"
          done
      - name: Build production images
        run: |
          docker build -t xiaom-blog-api:ci blog-backend
          docker build -t xiaom-blog-web:ci blog-frontend
      - name: Prepare local-only E2E environment
        run: cp .env.test.example .env.test
      - name: Validate Compose
        run: docker compose --env-file .env.test config --quiet
      - name: Start application
        run: docker compose --env-file .env.test up --build --wait --wait-timeout 240
      - name: Install Chromium
        working-directory: blog-frontend
        run: npx playwright install --with-deps chromium
      - name: Real browser journeys
        working-directory: blog-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: Admin_test_password_2026
        run: npm run test:e2e
      - name: Compose diagnostics
        if: failure()
        run: docker compose --env-file .env.test ps && docker compose --env-file .env.test logs --no-color
      - name: Stop application
        if: always()
        run: docker compose --env-file .env.test down --volumes --remove-orphans
